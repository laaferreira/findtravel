name: decolar-access-check

# Diagnóstico de acesso à Decolar a partir do IP do runner do GitHub Actions.
# Objetivo: descobrir se o bloqueio anti-bot (HTTP 403) observado localmente
# é apenas por reputação do IP de saída. Se o runner tiver acesso (HTTP 200),
# o script faz dump de HTML + screenshot para mapearmos os seletores reais.
#
# NÃO tenta burlar proteção anti-bot. Apenas acessa uma vez e reporta.
# Execução somente manual (workflow_dispatch).

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL da Decolar a testar'
        required: false
        default: 'https://www.decolar.com/pacotes/'

permissions:
  contents: read

jobs:
  access-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HEADLESS: 'true'
      DECOLAR_URL: ${{ github.event.inputs.url }}
      NAVIGATION_TIMEOUT_MS: '45000'
      ARTIFACTS_DIR: artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run access diagnostic
        # continua mesmo em bloqueio (exit 2) para publicar os artefatos.
        run: npm run inspect:decolar || true

      - name: Show summary
        if: always()
        run: |
          echo "----- inspect-summary.txt -----"
          cat artifacts/inspect-summary.txt || echo "(sem resumo)"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decolar-access-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
